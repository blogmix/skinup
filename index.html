<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Мой Апгрейдер</title>
<style>
  body { background: #1b1d24; color: #eee; font-family: Arial, sans-serif; text-align: center; }
  #wheel { transition: transform 4s cubic-bezier(0.15, 0.9, 0.2, 1); }
  .btn { padding: 10px 18px; margin: 5px; border: none; border-radius: 8px;
         background: #4caf50; color: #fff; font-size: 16px; cursor: pointer; }
  .btn:hover { background: #5dbf5f; }
  #balance { font-size: 22px; margin: 15px; }
</style>
</head>
<body>

<h1>🔥 Апгрейдер</h1>
<div id="balance">Баланс: 1000 ₽</div>

<p>Ставка: <input id="bet" type="number" value="100" min="1" style="width:80px"></p>
<p>Множитель:
  <button class="btn mult" data-x="1.5">x1.5</button>
  <button class="btn mult" data-x="2">x2</button>
  <button class="btn mult" data-x="5">x5</button>
  <button class="btn mult" data-x="10">x10</button>
</p>
<p>Шанс выигрыша: <b id="chance">50%</b></p>
<button class="btn" id="spin" style="font-size:20px">КРУТИТЬ</button>
<h2 id="result"></h2>

<canvas id="wheel" width="320" height="320"></canvas>

<script>
let balance = 1000, mult = 2;

function drawWheel(chance) {
  const c = document.getElementById('wheel'), ctx = c.getContext('2d');
  const cx = 160, cy = 160, r = 140;
  // красный — проигрыш, зелёный — выигрыш
  ctx.clearRect(0, 0, 320, 320);
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI);
  ctx.fillStyle = '#c0392b'; ctx.fill();
  const winAngle = (chance / 100) * 2 * Math.PI;
  ctx.beginPath(); ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + winAngle);
  ctx.closePath(); ctx.fillStyle = '#2ecc71'; ctx.fill();
  // стрелка сверху
  ctx.beginPath(); ctx.moveTo(cx - 10, 5); ctx.lineTo(cx + 10, 5);
  ctx.lineTo(cx, 30); ctx.closePath();
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.strokeStyle = '#000'; ctx.stroke();
}

function updateChance() {
  // честная математика: шанс = ставка / выплата
  const chance = Math.min(95, (100 / mult) * 0.95);
  document.getElementById('chance').textContent = Math.round(chance) + '%';
  drawWheel(chance);
  return chance;
}

document.querySelectorAll('.mult').forEach(b => b.onclick = () => {
  mult = parseFloat(b.dataset.x);
  updateChance();
});

document.getElementById('spin').onclick = () => {
  const bet = parseInt(document.getElementById('bet').value);
  const chance = updateChance();
  const res = document.getElementById('result');

  if (bet > balance || bet < 1) { res.textContent = 'Недостаточно средств!'; return; }

  const roll = Math.random() * 100;
  const wheel = document.getElementById('wheel');
  wheel.style.transition = 'none'; wheel.style.transform = 'rotate(0deg)';
  void wheel.offsetWidth; // перезапуск анимации
  wheel.style.transition = 'transform 4s cubic-bezier(0.15, 0.9, 0.2, 1)';

  const win = roll < chance;
  // крутим стрелку до случайного угла: если попали в зелёный сектор — победа
  const angle = 360 * 6 + (win ? Math.random() * chance : chance + Math.random() * (100 - chance)) * 3.6;
  wheel.style.transform = `rotate(${angle}deg)`;

  setTimeout(() => {
    if (win) { balance += bet * (mult - 1); res.textContent = '🎉 Победа! +' + bet * (mult - 1) + ' ₽'; }
    else     { balance -= bet;             res.textContent = '💀 Проигрыш. −' + bet + ' ₽'; }
    document.getElementById('balance').textContent = 'Баланс: ' + Math.round(balance) + ' ₽';
  }, 4100);
};

updateChance();
</script>
</body>
</html>
